<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f4" />
    <title>Casa Piena · Control de obra</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Si el bundle truena antes de que React monte, muestra el error en vez de una pantalla en blanco.
      window.addEventListener("error", function (e) {
        var r = document.getElementById("root");
        if (r && !r.children.length) r.innerHTML = '<div style="font-family:system-ui;padding:24px;max-width:520px;margin:40px auto;color:#1c1c1a"><h2 style="margin:0 0 8px">Algo falló al cargar</h2><p style="color:#6b6b66">Recarga la página. Si sigue igual, comparte este mensaje:</p><pre style="white-space:pre-wrap;background:#f1f1ee;border-radius:8px;padding:10px;font-size:12px">' + (e.message || e) + "</pre></div>";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
